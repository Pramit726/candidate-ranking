[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redrob-ranker"
version = "1.0.0"
description = "Evidence-grounded, CPU-only hybrid candidate ranker for the Redrob Intelligent Candidate Discovery & Ranking challenge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Redrob Ranker Team" }]

dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "xgboost==3.2.0",
    "scipy",
    "sentence-transformers==5.5.1",
    "torch==2.7.1",
    "python-docx==1.2.0",
]

[project.optional-dependencies]
slm = ["llama-cpp-python==0.3.32"]
dev = ["pytest==9.1.1"]

[project.scripts]
redrob-rank = "redrob_ranker.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
